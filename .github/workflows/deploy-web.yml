name: Deploy Web → Vercel

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'vercel.json'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"projectId":"prj_BQJxSws7kniYzFxbAPsHbwy0dx0Z","orgId":"team_GOgsVRjGimt9lt7mc3HGovvs"}' \
            > .vercel/project.json

      - name: Deploy to Vercel
        # --archive=tgz uploads a single tarball instead of thousands of
        # individual files, avoiding the Hobby-tier "api-upload-free" 5000
        # files / 24h upload cap.
        run: npx vercel --prod --yes --archive=tgz --token "${{ secrets.VERCEL_TOKEN }}"
