name: Deploy API → Azure App Service

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-api.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @uniconnect/shared build

      - name: Build API
        run: pnpm --filter api build

      - name: Create standalone production package
        run: |
          pnpm --filter api deploy --prod /tmp/api-deploy
          cp -r apps/api/dist /tmp/api-deploy/dist

          # pnpm's virtual-store node_modules uses symlinks + nested sub-deps that
          # Azure's zip deployment cannot preserve. Re-install with npm to get a flat,
          # non-symlinked node_modules that works on any host.

          # 1. Save the workspace package (not on npm registry)
          cp -r /tmp/api-deploy/node_modules/@uniconnect /tmp/uniconnect-backup

          # 2. Strip the workspace reference so npm install doesn't try to fetch it
          jq 'del(.dependencies["@uniconnect/shared"])' \
            /tmp/api-deploy/package.json > /tmp/pkg-tmp.json
          mv /tmp/pkg-tmp.json /tmp/api-deploy/package.json

          # 3. Wipe pnpm node_modules and reinstall with npm (flat, no symlinks)
          rm -rf /tmp/api-deploy/node_modules
          cd /tmp/api-deploy && npm install --omit=dev --ignore-scripts

          # 4. Restore the workspace package
          mkdir -p /tmp/api-deploy/node_modules/@uniconnect
          cp -r /tmp/uniconnect-backup/shared \
            /tmp/api-deploy/node_modules/@uniconnect/shared

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: /tmp/api-deploy
