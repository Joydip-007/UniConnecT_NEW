name: Deploy API → Azure App Service

on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-api.yml'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install all dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared package
        run: pnpm --filter @uniconnect/shared build

      - name: Build API
        run: pnpm --filter api build

      - name: Create standalone production package
        run: |
          pnpm --filter api deploy --prod /tmp/api-deploy
          cp -r apps/api/dist /tmp/api-deploy/dist

          # pnpm's virtual-store node_modules uses symlinks + hard-links that
          # Azure's zip deployment cannot preserve. Re-install with npm to get a flat,
          # non-symlinked node_modules that works on any host.

          # 1. Strip the workspace reference so npm install doesn't try to fetch it
          jq 'del(.dependencies["@uniconnect/shared"])' \
            /tmp/api-deploy/package.json > /tmp/pkg-tmp.json
          mv /tmp/pkg-tmp.json /tmp/api-deploy/package.json

          # 2. Wipe pnpm node_modules and reinstall with npm (flat, no symlinks)
          rm -rf /tmp/api-deploy/node_modules
          cd /tmp/api-deploy && npm install --omit=dev --ignore-scripts

          # 3. Copy @uniconnect/shared directly from the built source (not from
          #    pnpm's virtual store, which contains symlinks that break after
          #    node_modules is wiped).
          mkdir -p /tmp/api-deploy/node_modules/@uniconnect/shared
          cp -rL $GITHUB_WORKSPACE/packages/shared/dist \
            /tmp/api-deploy/node_modules/@uniconnect/shared/dist
          cp -rL $GITHUB_WORKSPACE/packages/shared/src \
            /tmp/api-deploy/node_modules/@uniconnect/shared/src
          cp $GITHUB_WORKSPACE/packages/shared/package.json \
            /tmp/api-deploy/node_modules/@uniconnect/shared/package.json

      - name: Verify shared package is present
        run: |
          echo "=== @uniconnect/shared contents ==="
          ls -la /tmp/api-deploy/node_modules/@uniconnect/shared/
          echo "=== dist/ contents ==="
          ls -la /tmp/api-deploy/node_modules/@uniconnect/shared/dist/

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: /tmp/api-deploy
