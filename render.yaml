services:
  # The Frontend (if you still want Render to host it instead of Vercel)
  - type: web
    name: uniconnect-web
    runtime: static
    buildCommand: npx pnpm install --frozen-lockfile && npx pnpm --filter web build
    staticPublishPath: apps/web/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
      - key: VITE_SOCKET_URL
        sync: false
      - key: VITE_UNIVERSITY_DOMAIN
        value: uiu.ac.bd

  # The Backend API (New)
  - type: web
    name: uniconnect-api
    runtime: node
    region: singapore # Matches your AWS_REGION roughly, adjust as needed
    buildCommand: npx pnpm install --frozen-lockfile && npx pnpm --filter api build
    startCommand: npx pnpm --filter api db:migrate:prod && npx pnpm --filter api start
    healthCheckPath: /health
    envVars:
      - key: CLIENT_URL
        value: https://uniconnectt.me,https://www.uniconnectt.me
      - key: DATABASE_URL
        fromDatabase:
          name: uniconnect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: uniconnect-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

  # Email / notification background worker (processes Bull queue jobs)
  - type: worker
    name: uniconnect-worker
    runtime: node
    region: singapore
    buildCommand: npx pnpm install --frozen-lockfile && npx pnpm --filter api build
    startCommand: npx pnpm --filter api worker:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: uniconnect-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: uniconnect-redis
          property: connectionString
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
      - key: CLIENT_URL
        value: https://uniconnectt.me,https://www.uniconnectt.me

  - type: keyvalue
    name: uniconnect-redis
    region: singapore
    ipAllowList: [] # only allow internal Render connections

databases:
  - name: uniconnect-db
    databaseName: uniconnect
    user: uniconnect
    plan: free
